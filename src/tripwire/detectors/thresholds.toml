[consent]
extra_clicks = 2
area_ratio = 3.0
low_contrast = 3.0
high_contrast = 4.5
decline_phrases = ["prefer a worse experience", "hate saving money", "don't want to not"]

[obstruction]
deep_tree_level = 12
extra_clicks = 3
small_font = 12
low_contrast = 3.0

[sneaking]
min_drift_minor = 1
small_font = 12
low_contrast = 3.0

[urgency]
# A real countdown loses the elapsed time across a reload. More than this many extra
# seconds shown means it restarted. Covers capture jitter (about half a second) with margin.
reset_tolerance_s = 3.0

[wire]
# Values that mean "yes" when a field appears in a submitted body.
on_values = ["1", "on", "true", "yes", "y"]
# Fields a page may add at submit for security reasons; never treated as choices.
security_names = "csrf|xsrf|token|nonce|authenticity|_method|captcha"

[nagging]
# A login wall reached through one of these is an expected sign-in, not forced registration.
account_words = "sign\\s*in|log\\s*in|account|register|sign\\s*up|join|subscribe|member"
