<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Modal</title></head>
<body style="margin:0">
<main><p>Article text.</p><a href="/more">Read more</a></main>
<div style="position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:900" role="dialog" aria-modal="true" aria-label="Newsletter">
  <form style="background:#fff;padding:24px;width:400px">
    <h2>Get our newsletter</h2>
    <input type="email" aria-label="Email">
    <button type="submit">Subscribe</button>
    <button type="button">Close</button>
  </form>
</div>
</body>
</html>
