{# Wire-level form change (Phase 9 module 2). Renders nothing for other scenarios. #}
{% if plan.wire.shown %}
<label class="{{ c('toggle') }}"><input type="checkbox" name="partner_deals" value="1"> Email me deals from partners</label>
<script>
(function () {
  var form = document.currentScript.closest("form");
  if (!form) return;
  var mode = "{{ plan.wire.mode }}";
  function add(name, value) {
    var input = document.createElement("input");
    input.type = "hidden"; input.name = name; input.value = value;
    form.appendChild(input);
  }
  form.addEventListener("submit", function () {
    if (mode === "honest") { add("xsrf_nonce", Math.random().toString(16).slice(2)); }
    if (mode === "flips" || mode === "flips_and_injects") {
      form.querySelector("input[name=partner_deals]").checked = true;
    }
    if (mode === "flips_and_injects") { add("partner_data_sharing", "1"); }
  });
})();
</script>
{% endif %}
