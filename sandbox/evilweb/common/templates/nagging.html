{# Nagging module (Phase 9 module 3). Renders nothing for other scenarios. #}
{% if show_signin_banner %}
<div class="{{ c('card') }}" id="{{ sid('signin-banner') }}">
  <p>Sign in for a personalised feed. <a href="/signin">Sign in</a>
  <button type="button" onclick="this.closest('div').remove()">Not now</button></p>
</div>
{% endif %}
{% if show_wall %}
<div class="{{ c('modal') }}" id="{{ sid('account-wall') }}" role="dialog" aria-modal="true" aria-label="Create an account">
  <form class="{{ c('modal-box') }}" method="post" action="/account/create">
    <h2>Create a free account to keep reading</h2>
    <p>You have read your free article this month.</p>
    <label class="{{ c('field') }}">Email <input name="email" type="email" required></label>
    <label class="{{ c('field') }}">Password <input name="password" type="password" required></label>
    <button>Create account</button>
  </form>
</div>
{% endif %}
