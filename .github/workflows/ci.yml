name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Install Chromium for the browser tests
        run: uv run playwright install --with-deps chromium

      - name: Tests (unit and browser)
        run: uv run pytest

      - name: Score the labeled sandbox and check for regressions
        run: uv run --locked tripwire eval

      - name: Score the Phase 9 false-urgency module
        run: uv run --locked tripwire eval --module urgency
