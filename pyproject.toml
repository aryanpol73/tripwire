[project]
name = "tripwire"
version = "0.0.1"
description = "A general-purpose web dark-pattern auditing agent that records reproducible evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "playwright>=1.49",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.12",
    "pyyaml>=6",
    "uvicorn>=0.32",
]

[project.scripts]
tripwire = "tripwire.cli:main"
evilweb = "evilweb.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pre-commit>=4",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire", "sandbox/evilweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the hold-out fixture packages
addopts = "-ra --strict-markers"
markers = ["browser: needs Playwright Chromium (uv run playwright install chromium)"]
filterwarnings = [
    # Starlette's test client nags about a future httpx successor; httpx works fine today.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "src", "sandbox", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplifications
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# A CSS stylesheet in an f-string: wrapping it would only make it harder to read.
"sandbox/evilweb/skins.py" = ["E501"]
"holdout2/app.py" = ["E501"]  # the same kind of CSS stylesheet
